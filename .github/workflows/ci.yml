name: CI

# Runs on every pull request, and on main after a merge.
# Deliberately does NOT run main.py: that probes third-party services, and a
# pull request must never go red because someone else's website had a bad day.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Cheapest checks first: these fail in seconds if something is wrong.
      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: python -m pytest -q