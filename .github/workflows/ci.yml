name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: python -m pytest -q

  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The site is only ever built from code that already passed.
    needs: check
    # ...and only on main. A pull request must not produce a release artifact.
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Only the application's dependencies. ruff and pytest have no business
      # being here: this job builds, it does not verify.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate the page
        run: python main.py

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: build

    # Deploying is the only thing in this repository that changes the outside
    # world, so it gets its own permissions and nothing else does.
    permissions:
      pages: write      # call the Pages deployment API
      id-token: write   # prove to GitHub that this run is who it says it is

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # One deployment at a time. A second push while this runs waits its turn
    # instead of racing it.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4